      const trigger = document.getElementById('courses-menu-group');
      const menu = document.getElementById('courses-mega-menu');
      if (!trigger || !menu) return;

      let timer = null;

      function open() {
        if (timer) clearTimeout(timer);
        menu.classList.remove('opacity-0', 'invisible', 'pointer-events-none');
        menu.classList.add('opacity-100', 'visible', 'pointer-events-auto');
      }

      function close() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          menu.classList.remove('opacity-100', 'visible', 'pointer-events-auto');
          menu.classList.add('opacity-0', 'invisible', 'pointer-events-none');
        }, 250);
      }

      trigger.addEventListener('mouseenter', open);
      trigger.addEventListener('mouseleave', close);
      menu.addEventListener('mouseenter', open);
      menu.addEventListener('mouseleave', close);
    })();


    // 1. Countdown Timer for Batch Admission Urgency
    function initCountdown() {
      // 4 days 16 hours from now
      let targetDate = new Date().getTime() + (4 * 24 * 60 * 60 * 1000) + (16 * 60 * 60 * 1000);

      setInterval(function () {
        let now = new Date().getTime();
        let diff = targetDate - now;

        if (diff > 0) {
          let days = Math.floor(diff / (1000 * 60 * 60 * 24));
          let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          let secs = Math.floor((diff % (1000 * 60)) / 1000);

          document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
          document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
          document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
          document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }
      }, 1000);
    }
    initCountdown();

    // Smooth Number Counter Animation for Institutional Impact Card
    function initCounters() {
      const counters = document.querySelectorAll('.counter-number');
      if (!counters.length) return;

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            const target = parseInt(el.getAttribute('data-target'), 10);
            const format = el.getAttribute('data-format');
            const duration = 2200;
            const startTime = performance.now();

            function updateCounter(currentTime) {
              const elapsed = currentTime - startTime;
              const progress = Math.min(elapsed / duration, 1);
              // Ease-out cubic curve for natural slowdown
              const easeOut = 1 - Math.pow(1 - progress, 3);
              const currentVal = Math.floor(easeOut * target);

              if (format === 'comma') {
                el.textContent = currentVal.toLocaleString('en-US');
              } else {
                el.textContent = currentVal;
              }

              if (progress < 1) {
                requestAnimationFrame(updateCounter);
              } else {
                el.textContent = (format === 'comma') ? target.toLocaleString('en-US') : target;
              }
            }

            requestAnimationFrame(updateCounter);
            obs.unobserve(el);
          }
        });
      }, { threshold: 0.15 });

      counters.forEach(counter => observer.observe(counter));
    }
    initCounters();

    function openTrainerModal(id) {
      const trainer = trainersData[id] || trainersData['18766'];

      document.getElementById('trainer-modal-designation').textContent = trainer.designation;
      document.getElementById('trainer-modal-exp').textContent = trainer.experience;
      document.getElementById('trainer-modal-rating').innerHTML = `<i data-lucide="star" class="w-3 h-3 fill-amber-400 text-amber-400"></i> ${trainer.rating}`;

    function setTrainerFilter(cat) {
      currentTrainerFilter = cat;
      document.querySelectorAll('.trainer-filter-btn').forEach(btn => {

          btn.className = 'trainer-filter-btn px-3 py-2 rounded-xl font-bold bg-brand-emerald text-white transition whitespace-nowrap cursor-pointer';
        } else {
          btn.className = 'trainer-filter-btn px-3 py-2 rounded-xl font-bold bg-white/10 text-white/80 hover:bg-white/20 transition whitespace-nowrap cursor-pointer';
        }
      });
      renderTrainersDirectory();
    }

    function filterTrainersDirectory() {
      renderTrainersDirectory();

    function renderTrainersDirectory() {
      const container = document.getElementById('trainers-directory-grid');
      if (!container) return;
      const searchVal = (document.getElementById('trainer-search-input')?.value || '').toLowerCase().trim();

      const list = Object.values(trainersData).filter(t => {
        const matchesCategory = currentTrainerFilter === 'all' || t.category === currentTrainerFilter;
        const matchesSearch = !searchVal ||
          t.name.toLowerCase().includes(searchVal) ||
          t.designation.toLowerCase().includes(searchVal) ||
          t.specialty.toLowerCase().includes(searchVal) ||
          t.skills.some(s => s.toLowerCase().includes(searchVal));
        return matchesCategory && matchesSearch;
      });

      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500">
            <i data-lucide="user-x" class="w-8 h-8 mx-auto text-slate-400 mb-2"></i>
            <p class="font-bold">No trainers match your search.</p>
            <p class="text-xs mt-1">Try another keyword or select "All".</p>
          </div>
        `;
      } else {
        list.forEach(t => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-4 border border-slate-200/90 hover:border-brand-emerald/50 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group';
          card.innerHTML = `
            <div>
              <div class="relative aspect-square rounded-xl overflow-hidden bg-gradient-to-b from-[#F3F7F5] via-[#E8F3ED] to-[#D8EADB] border border-emerald-100/70 mb-3 shadow-inner">
                <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[9px] font-extrabold bg-white/90 text-emerald-800 shadow-sm border border-emerald-200/60 z-10">
                  ${t.experience}
                </span>
                <img src="${t.image}" alt="${t.name}" class="w-full h-full object-contain object-bottom pt-2 group-hover:scale-105 transition-transform duration-300">
              </div>
              <h4 class="text-sm font-extrabold text-slate-900 leading-snug group-hover:text-brand-forest transition-colors">${t.name}</h4>
              <p class="text-[11px] font-bold text-brand-emerald mt-0.5 line-clamp-1">${t.designation}</p>
              <div class="mt-2 text-[10px] text-slate-500 line-clamp-1">
                <span class="text-slate-400">Spec:</span> <strong class="text-slate-700">${t.specialty}</strong>
              </div>
            </div>
            <a href="trainer-profile.html?id=${t.id}" class="mt-3 w-full py-2 px-2.5 rounded-xl bg-slate-50 hover:bg-brand-emerald text-slate-700 hover:text-white border border-slate-200/80 hover:border-brand-emerald text-[11px] font-bold transition-all flex items-center justify-center gap-1 shadow-sm">
              <span>View Full Authority Profile</span>
              <i data-lucide="arrow-right" class="w-3 h-3"></i>
            </a>
          `;
          container.appendChild(card);
        });
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }
